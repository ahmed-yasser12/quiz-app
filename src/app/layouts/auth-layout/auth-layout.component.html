
<!-- Main Auth Layout -->
<div class="min-h-screen bg-slate-50 overflow-x-hidden">

  <!-- Desktop Layout -->
  <div class="grid min-h-screen grid-cols-1 lg:grid-cols-3">

    <!-- Left Sidebar -->
    <aside class="relative lg:col-span-1">
      <app-auth-sidebar
        class="block lg:fixed lg:inset-y-0 lg:left-0 lg:w-1/3 xl:w-1/3 lg:z-40"
      ></app-auth-sidebar>
    </aside>

    <!-- Right Content Area -->
    <main
      class="relative flex min-h-screen flex-col lg:col-span-2"
    >

      <!-- Top Navigation -->
      <header
        class="sticky top-0 z-30 w-full border-b border-slate-200 bg-white"
        dataAos="fade-left"
        dataAosDuration="1000"
        data-aos-delay="300"
      >
        <div
          class="mx-auto flex w-full max-w-3xl items-center justify-center gap-2 px-4 py-4 sm:px-6 lg:py-5"
        >

          <!-- Sign In -->
          <a
            routerLink="/auth/sign-in"
            routerLinkActive="bg-slate-100 text-[#1E3A5F]"
            class="rounded-lg px-4 py-2.5 text-sm font-semibold text-slate-600 transition-colors duration-200 hover:bg-slate-50 hover:text-[#1E3A5F] sm:px-5"
          >
            Sign in
          </a>

          <!-- Register -->
          <button
            routerLink="/auth/sign-up"
            routerLinkActive="bg-[#1E3A5F]"
            class="cursor-pointer rounded-lg border border-[#1E3A5F] bg-[#1E3A5F] px-4 py-2.5 text-sm font-semibold text-gray-500 transition-colors duration-200 hover:bg-[#17304f] focus:outline-none focus:ring-2 focus:ring-[#1E3A5F]/20 sm:px-5"
          >
            Register
          </button>

        </div>
      </header>

      <!-- Router Outlet -->
      <section
        class="flex flex-1 items-center justify-center px-4 py-8 sm:px-6 sm:py-10 lg:px-8 xl:px-12"
      >
        <div class="w-full">
          <router-outlet></router-outlet>
        </div>
      </section>

    </main>

  </div>
</div>
