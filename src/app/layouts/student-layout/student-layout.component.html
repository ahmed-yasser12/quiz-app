
<!-- Main Student Layout -->
<div class="min-h-screen bg-slate-50 overflow-x-hidden">

    <div class="grid min-h-screen grid-cols-1 lg:grid-cols-3 xl:grid-cols-5">

        <!-- Desktop Sidebar -->
        <aside class="relative hidden lg:block lg:col-span-1">
            <app-side-bar
                class="lg:fixed lg:inset-y-0 lg:left-0 lg:w-1/3 xl:w-1/5 lg:z-40"
            ></app-side-bar>
        </aside>

        <!-- Main Content -->
        <main class="col-span-1 flex min-h-screen flex-col lg:col-span-2 xl:col-span-4">

            <div class="mx-auto w-full max-w-[1600px] px-4 sm:px-6 lg:px-8 xl:px-12 2xl:px-16">

                <!-- Header -->
                <app-header
                    (toggleSidebar)="onToggleSidebar()"
                    class="sticky top-0 z-30 block"
                ></app-header>

                <!-- Router Content -->
                <div class="py-6 sm:py-8 lg:py-10">
                    <router-outlet></router-outlet>
                </div>

            </div>

        </main>

    </div>

</div>

<!-- Mobile Sidebar -->
<app-side-bar
    class="lg:hidden"
    [isOpen]="sidebarOpen"
    (closeSidebarEvent)="sidebarOpen = false"
></app-side-bar>
